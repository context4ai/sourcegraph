<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户设置 · Context Source Graph</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/base.css"><script src="assets/app.js"></script><script src="assets/select.js"></script>
</head>
<body data-page="user-settings" class="min-h-screen bg-paper font-sans text-ink">
<div id="site-header"></div>
<main class="mx-auto max-w-page px-4 sm:px-8">
  <section class="pb-10 pt-10 sm:pt-12"><h1 class="type-page" data-en="User settings">用户设置</h1><p class="type-deck lede mt-4" data-en="Manage API and code service credentials">设置 API 访问凭证及代码服务访问凭证</p></section>
  <section id="token-access" role="status" class="border-t rule py-8 text-[14px]"></section>
  <div id="token-content" class="hidden">
    <section class="grid gap-6 border-t rule py-10 lg:grid-cols-[minmax(0,4fr)_minmax(0,8fr)] lg:gap-12">
      <div><h2 class="type-section" data-en="API Tokens">API Tokens</h2><p class="mt-3 text-[14px] text-muted" data-en="Search and read private repositories, and trigger indexing">用于搜索和阅读非公开仓库，及触发索引操作</p><button id="new-token" class="mt-6 rounded-control bg-ink px-3.5 py-1.5 text-[13.5px] font-medium text-paper hover:opacity-90 disabled:opacity-40" data-en="Create token">创建 Token</button></div>
      <div class="min-w-0">
        <p id="token-error" role="alert" class="mb-3 break-words text-[14px] text-danger empty:hidden"></p>
        <div class="field p-1.5 sm:p-2"><ul id="token-rows" class="divide-y divide-ink/[0.06]"></ul></div>
        <div id="token-pager" class="mt-4 flex flex-wrap items-center gap-3"><button id="previous-tokens" class="rounded-control bg-ink/[0.05] px-3 py-1.5 text-[13px] hover:bg-ink/[0.08] disabled:opacity-40" data-en="Previous page">上一页</button><span id="token-page" class="type-fig"></span><button id="next-tokens" class="rounded-control bg-ink/[0.05] px-3 py-1.5 text-[13px] hover:bg-ink/[0.08] disabled:opacity-40" data-en="Next page">下一页</button><button id="refresh-tokens" class="ml-auto rounded-control px-3 py-1.5 text-[13px] text-muted hover:bg-ink/[0.05] hover:text-ink disabled:opacity-40" data-en="Refresh">刷新</button></div>
<div class="mt-6 text-[14px]">        <pre class="field overflow-x-auto p-4 font-mono text-[13px] leading-6 sm:p-5">Authorization: Bearer &lt;token&gt;</pre>
        <p class="mt-4 text-muted" data-en="HTTP requests and MCP clients use the same header. The connect page can fill in your token for each client.">HTTP 请求和 MCP 客户端使用同一个请求头；接入页可把你的 Token 直接填进各客户端的配置</p>
        <a href="/sourcegraph/connect#mcp" class="mt-3 inline-block text-[13.5px] underline underline-offset-4" data-en="View connection examples">查看接入示例</a>
</div>
      </div>
    </section>


    <section data-code-credentials="personal" class="grid gap-6 border-t rule py-10 lg:grid-cols-[minmax(0,4fr)_minmax(0,8fr)] lg:gap-12">
      <div><h2 class="type-section" data-en="Code service access">接入设置</h2><p class="mt-3 text-[14px] text-muted" data-en="Used for repositories you register; global credentials are the fallback">你登记的仓库优先使用个人凭证，过期或访问失败时使用全局兜底</p></div>
      <div class="credential-forms min-w-0 space-y-5"></div>
    </section>
  </div>
</main>
<dialog id="token-create-dialog" class="lift w-[min(92vw,520px)] rounded-float bg-card p-6 text-ink backdrop:bg-ink/30" aria-labelledby="token-create-title">
  <h2 id="token-create-title" class="font-display text-[22px] font-medium" data-en="Create API Token">创建 API Token</h2>
  <form id="token-create-form" class="mt-5" novalidate>
    <label class="block text-[13px]"><span data-en="Name">名称</span><input id="token-name" required maxlength="128" autocomplete="off" aria-describedby="token-name-error" class="mt-2 block w-full rounded-control bg-ink/[0.04] px-3 py-2 text-[14px] outline-none ring-1 ring-transparent focus:ring-ink/20 aria-[invalid=true]:ring-danger/60"></label>
    <p id="token-name-error" class="mt-2 flex items-center gap-1.5 text-[12.5px] text-danger empty:hidden"></p>
    <label class="mt-5 block text-[13px]"><span data-en="Expires in">有效期</span><select id="token-expiry" class="mt-2 block w-full rounded-control bg-sand px-3 py-2 text-[14px]"><option value="30" data-en="30 days">30 天</option><option value="90" selected data-en="90 days">90 天</option><option value="365" data-en="1 year">1 年</option><option value="0" data-en="No expiration">永不过期</option></select></label>
    <label class="mt-5 block text-[13px]"><input id="token-prepare" type="checkbox"> <span data-en="Allow index preparation (administrators only)">允许准备索引（仅管理员）</span></label>
    <p id="token-create-error" role="alert" class="mt-3 text-[13px] text-danger"></p>
    <div class="mt-6 flex justify-end gap-2"><button id="token-create-cancel" type="button" class="rounded-control px-3 py-2 text-[14px] hover:bg-sand" data-en="Cancel">取消</button><button id="token-create-submit" type="submit" class="rounded-control bg-ink px-3 py-2 text-[14px] text-paper disabled:opacity-40" data-en="Create">创建</button></div>
  </form>
  <section id="token-created" class="hidden mt-5">
    <p class="text-[14px]" data-en="Token created. You can copy it again from the list at any time.">Token 已创建，之后也可以在列表中随时复制</p>
    <label for="token-secret" class="sr-only" data-en="New token">新 Token</label><textarea id="token-secret" readonly rows="2" autocomplete="off" spellcheck="false" class="mt-4 w-full resize-none rounded-control bg-ink/[0.04] p-3 font-mono text-[13px]"></textarea>
    <div class="mt-5 flex justify-end gap-2"><button id="token-copy" type="button" class="rounded-control bg-ink px-3 py-2 text-[14px] text-paper" data-en="Copy token">复制 Token</button><button id="token-done" type="button" class="rounded-control px-3 py-2 text-[14px] hover:bg-sand" data-en="Done">完成</button></div>
  </section>
</dialog>
<dialog id="token-delete-dialog" class="lift w-[min(92vw,480px)] rounded-float bg-card p-6 text-ink backdrop:bg-ink/30" aria-labelledby="token-delete-title">
  <h2 id="token-delete-title" class="font-display text-[22px] font-medium" data-en="Delete API Token?">删除 API Token？</h2><p id="token-delete-detail" class="mt-3 break-words text-[14px] text-muted"></p><p id="token-delete-error" role="alert" class="mt-3 text-[13px] text-danger"></p>
  <div class="mt-6 flex justify-end gap-2"><button id="token-delete-cancel" class="rounded-control px-3 py-2 text-[14px] hover:bg-sand" data-en="Cancel">取消</button><button id="token-delete-confirm" class="rounded-control bg-danger px-3 py-2 text-[14px] text-paper disabled:opacity-40" data-en="Delete token">确认删除</button></div>
</dialog>
<div id="site-footer"></div><script src="assets/api-tokens-page.js"></script>
<script src="assets/code-credentials.js"></script>
</body>
</html>
