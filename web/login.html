<!doctype html>

<button id="login-lang" type="button" class="rounded-control px-3 py-2 font-mono text-[12px] text-muted hover:bg-sand" aria-label="Switch to English">EN</button>

<main class="mx-auto flex w-full max-w-[480px] flex-1 flex-col justify-center px-6 py-16 sm:py-24" aria-labelledby="login-title">

<footer class="px-6 pb-8 text-center font-mono text-[11px] text-muted">Built by Context4AI</footer>
