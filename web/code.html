<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>代码阅读 · Context Source Graph</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/base.css?v=20260927-5">
  <script src="assets/app.js?v=20260927-5"></script>
  <script src="assets/select.js?v=20260927-5"></script>
<style>
#blob{tab-size:4}#blob:empty{min-height:8rem}#blob .code-line{min-height:24px}#tree button,#tree a{min-height:30px}#tree [data-more]{margin-left:12px}
@media(max-width:1023px){#file-sidebar{display:none;position:fixed;z-index:40;inset:64px auto 0 0;width:min(320px,90vw);padding:20px;background:oklch(var(--card));overflow:auto;box-shadow:12px 0 24px oklch(var(--ink) / .1)}#file-sidebar.open{display:block}#jump,#find{font-size:16px}}
</style>
</head>
<body data-page="search" class="min-h-screen bg-paper font-sans text-ink">
<div id="site-header"></div>

<main class="mx-auto grid max-w-page gap-10 px-4 pt-8 sm:px-8 lg:grid-cols-[220px_minmax(0,1fr)]">
  <aside id="file-sidebar" class="lg:sticky lg:top-20 lg:max-h-[calc(100vh-6rem)] lg:overflow-auto">
    <a id="repo-link" class="block font-mono text-[13px] hover:underline"></a>
    <button id="sha" class="mt-1 font-mono text-[12px] text-muted hover:text-ink" title="复制完整 SHA"></button>
    <button id="files-close" class="mt-3 rounded-control bg-ink/[0.05] px-3 py-1.5 text-[13px] lg:hidden" data-en="Close">关闭</button>
    <ul id="tree" class="mt-6 space-y-px font-mono text-[12.5px]"></ul>
  </aside>

  <section class="min-w-0">
    <button id="files-toggle" class="mb-4 rounded-control bg-ink/[0.05] px-3 py-1.5 text-[13px] lg:hidden" aria-controls="file-sidebar" aria-expanded="false" data-en="Files">文件</button>
    <nav id="crumbs" class="flex flex-wrap items-center gap-1 font-mono text-[13px]"></nav>
    <h1 tabindex="-1" id="title" class="type-page mt-3 break-all"></h1>
    <p id="meta" class="type-deck lede mt-2"></p>
    <div class="mt-5 flex flex-wrap items-center gap-2">
      <button id="cite" class="rounded-control bg-ink px-3 py-1.5 text-[13.5px] font-medium text-paper hover:opacity-90 disabled:opacity-40" data-en="Copy citation">复制引用</button>
      <button id="permalink" class="rounded-control bg-ink/[0.05] px-3 py-1.5 text-[13.5px] hover:bg-ink/[0.08] disabled:opacity-40" data-en="Copy permalink">复制固定链接</button>
      <a id="in-file" class="ml-2 text-[13.5px] text-muted hover:text-ink" data-en="Search in this file">在此文件中搜索</a>
      <a id="latest" class="text-[13.5px] text-muted hover:text-ink" data-en="Branch head">分支最新</a>
      <details id="more" class="relative">
        <summary class="flex cursor-pointer list-none items-center gap-1 rounded-control px-2 py-1.5 text-[13.5px] text-muted hover:text-ink"><span data-en="More">更多</span><span id="more-chev"></span></summary>
        <div class="lift absolute left-0 z-20 mt-2 w-48 rounded-surface bg-card p-1.5 text-[13.5px]">
          <a id="back-search" class="block rounded-control px-2 py-1.5 hover:bg-sand" data-en="Search this repository">在此仓库搜索</a>
          <a id="source-link" target="_blank" rel="noopener noreferrer" class="block rounded-control px-2 py-1.5 hover:bg-sand" data-en="View on github.com">在 github.com 查看</a>
          <button id="copy-path" class="block w-full rounded-control px-2 py-1.5 text-left hover:bg-sand disabled:opacity-40" data-en="Copy path">复制路径</button>
          <button id="copy-code" class="block w-full rounded-control px-2 py-1.5 text-left hover:bg-sand disabled:opacity-40" data-en="Copy loaded code">复制已加载代码</button>
        </div>
      </details>
    </div>
    <div id="read-notice" role="status" aria-live="polite" class="mt-4 text-[13px] empty:hidden"></div>
    <div class="mt-6 flex flex-wrap items-center gap-x-4 gap-y-2">
      <p id="sel" class="type-fig min-h-[14px]"></p>
      <div id="tools" class="ml-auto flex items-center gap-2">
        <input id="jump" class="w-24 rounded-control bg-ink/[0.04] px-2 py-1 font-mono text-[12.5px] outline-none placeholder:text-muted/70 focus:bg-ink/[0.06]" placeholder="跳到行" data-en-ph="Go to line" aria-label="Go to line or range">
        <button id="jump-go" class="sr-only" data-en="Go">跳转</button>
        <input id="find" class="w-36 rounded-control bg-ink/[0.04] px-2 py-1 font-mono text-[12.5px] outline-none placeholder:text-muted/70 focus:bg-ink/[0.06]" placeholder="查找" data-en-ph="Find" aria-label="Find in loaded text">
        <span id="find-count" class="type-fig empty:hidden"></span>
      </div>
    </div>
    <button id="load-above" class="mt-2 hidden text-[13px] text-muted hover:text-ink"></button>
    <div id="blob" class="field mt-2 overflow-x-auto py-3 font-mono text-[13px] leading-6"></div>
    <div class="mt-3 flex flex-wrap items-center gap-4">
      <p id="read-extent" class="type-fig"></p>
      <button id="load-below" class="hidden text-[13px] text-muted hover:text-ink"></button>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="assets/read-page.js"></script>
</body>
</html>
