app = 'context4ai-sourcegraph'
primary_region = 'sin'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  SOURCEGRAPH_DATABASE = 'sqlite'
  SOURCEGRAPH_DATA_ROOT = '/data'
  SOURCEGRAPH_ORIGIN = 'https://context4ai-sourcegraph.fly.dev'
  SOURCEGRAPH_SEED_DEMO = 'true'
  SOURCEGRAPH_MIN_FREE_BYTES = '1073741824'

[[mounts]]
  source = 'sourcegraph_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = '30s'
  interval = '30s'
  timeout = '5s'
  method = 'GET'
  path = '/sourcegraph/healthz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '2gb'

[deploy]
  strategy = 'immediate'
