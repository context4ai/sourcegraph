name: Verify and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - run: bun run check
      - run: go test -p 1 ./...
      - name: Snapshot transport with minimum supported Git
        run: |
          curl --fail --location --retry 3 --max-time 120 https://github.com/git/git/archive/refs/tags/v2.30.2.tar.gz -o /tmp/git-2.30.2.tar.gz
          tar -xzf /tmp/git-2.30.2.tar.gz -C /tmp
          make -C /tmp/git-2.30.2 -j2 prefix=/tmp/git230 NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_CURL=YesPlease NO_EXPAT=YesPlease NO_OPENSSL=YesPlease install
          PATH=/tmp/git230/bin:$PATH git --version
          PATH=/tmp/git230/bin:$PATH go test -count=1 -v ./internal/gitstore -run TestShallowSnapshots
      - run: python3 scripts/audit-public.py
      - run: docker build --build-arg BUILD_REVISION=${{ github.sha }} -t sourcegraph:verify .
  databases:
    # MongoDB 8 rejects Linux 6.19+ (SERVER-121912). The 22.04 image uses Linux 6.8.
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: contract-test
          POSTGRES_DB: sourcegraph_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start MongoDB replica set
        run: |
          uname -r
          docker run -d --name mongo-contract -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Running}}' mongo-contract)" != true ]; then
              docker logs --tail 80 mongo-contract
              exit 1
            fi
            if docker exec mongo-contract mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 2
          done
          docker exec mongo-contract mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 40); do
            if docker exec mongo-contract mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: MongoDB container log
        if: failure()
        run: docker logs --tail 80 mongo-contract || true
      - run: go test -count=1 -v ./internal/storagecontract
        env:
          TEST_POSTGRES_URL: postgres://postgres:contract-test@localhost:5432/sourcegraph_test?sslmode=disable
          TEST_MONGODB_URL: mongodb://localhost:27017/?replicaSet=rs0
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, databases]
    runs-on: ubuntu-latest
    concurrency:
      group: sourcegraph-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false --build-arg BUILD_REVISION=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
